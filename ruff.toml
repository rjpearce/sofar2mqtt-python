# Ruff configuration for sofar2mqtt-python
# https://docs.astral.sh/ruff/

line-length = 100
target-version = "py310"
fix = true

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B904"]

[lint.isort]
known-first-party = ["sofar2mqtt"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# To fix E501 (line too long), run: ruff format